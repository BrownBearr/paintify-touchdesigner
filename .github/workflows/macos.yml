name: macOS build

# The macOS build cannot be exercised anywhere but a Mac, so it is built and
# run here on GitHub's Apple Silicon runners (macos-14 is an M1), the same
# way a user would: Homebrew dependencies, tools/build-mac.sh, then renders
# through MoltenVK and the Syphon bridge end to end.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  macos-apple-silicon:
    runs-on: macos-14
    timeout-minutes: 45
    env:
      # MoltenVK's own errors (Homebrew builds it silent by default). The
      # runner is a VM with a paravirtual GPU; gpu_vk.cpp already turns off
      # the two MoltenVK features that GPU lacks, so nothing else is set here.
      MVK_CONFIG_LOG_LEVEL: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Dependencies (Homebrew)
        run: brew install ninja glfw glslang molten-vk vulkan-loader vulkan-headers ffmpeg

      - name: Build
        run: tools/build-mac.sh --no-deps

      - name: GPU
        run: system_profiler SPDisplaysDataType || true

      - name: Headless render
        run: |
          mkdir -p ci
          build/gpu-sbr --headless --out ci/still.png | tee ci/still.log
          test -s ci/still.png
          # An exit code of 0 is not a painting: require strokes on every layer.
          grep -E "^seeds: [0-9]+  drawn: [1-9]" ci/still.log
          test "$(grep -cE '^  r .* drawn [1-9]' ci/still.log)" -eq 3

      - name: Feature sweep
        run: |
          paint() {
            name=$1; shift
            build/gpu-sbr --headless --out "ci/$name.png" "$@" | tee "ci/$name.log"
            grep -qE "^seeds: [0-9]+  drawn: [1-9]" "ci/$name.log"
          }
          paint relax --relax 3 --relax-remove 1 --relax-log
          paint etf-impasto --etf 2 --etf-log --impasto 0.3 --impasto-light 0.3
          paint pointillist --preset pointillist
          paint tensor --tensor-sigma 2 --debug-cells

      - name: Video and batch
        run: |
          ffmpeg -v error -f lavfi -i testsrc2=size=640x360:rate=12 \
                 -f lavfi -i sine=frequency=440 -t 2 \
                 -c:v libx264 -pix_fmt yuv420p -c:a aac ci/clip.mp4
          build/gpu-sbr --video ci/clip.mp4 --out ci/painted.mp4 --temporal-diff 12 --flow 3
          ffprobe -v error -show_entries stream=codec_type,nb_frames -of csv ci/painted.mp4
          frames=$(ffprobe -v error -select_streams v:0 -count_frames \
                   -show_entries stream=nb_read_frames -of csv=p=0 ci/painted.mp4)
          test "$frames" -eq 24
          mkdir -p ci/stills && cp ci/still.png ci/relax.png ci/stills/
          build/gpu-sbr --batch ci/stills --outdir ci/batch --format jpg
          test -s ci/batch/still_painted.jpg && test -s ci/batch/relax_painted.jpg

      - name: Syphon bridge (TouchDesigner live path)
        run: build/paintify-syphon-smoke

      - name: GUI (window, swapchain, ImGui)
        run: |
          build/gpu-sbr --in ci/still.png > ci/gui.log 2>&1 &
          pid=$!
          sleep 30
          screencapture -x ci/gui.png || true
          # Still running after 30 s of frames means the window, the
          # swapchain and ImGui all came up and kept presenting.
          alive=0; kill -0 "$pid" 2>/dev/null && alive=1
          kill "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true
          cat ci/gui.log
          test "$alive" = 1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-renders
          path: ci/

  linux-vulkan:
    # The Vulkan backend on Mesa's software rasteriser, with the validation
    # layer on: any validation message fails the job.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ninja-build libglfw3-dev libvulkan-dev glslang-dev \
               glslang-tools mesa-vulkan-drivers vulkan-validationlayers

      - name: Build
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DPAINTIFY_GPU=VULKAN
          cmake --build build

      - name: Render under validation
        env:
          PAINTIFY_VK_VALIDATION: "1"
        run: |
          mkdir -p ci
          for args in "" "--relax 2 --relax-remove 1" "--etf 2 --impasto 0.3 --impasto-light 0.3" \
                      "--preset pointillist"; do
            build/gpu-sbr --headless --out ci/out.png $args 2> ci/stderr.txt | tee ci/out.log
            cat ci/stderr.txt
            if grep -q "\[Vulkan" ci/stderr.txt; then exit 1; fi
            grep -qE "^seeds: [0-9]+  drawn: [1-9]" ci/out.log
          done
